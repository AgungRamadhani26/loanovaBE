# =============================================================================
# CI/CD PIPELINE UNTUK LOANOVA BACKEND
# =============================================================================
# 
# Workflow ini akan berjalan otomatis setiap kali ada:
# - Push ke branch main/master
# - Pull Request ke branch main/master
#
# ALUR PIPELINE:
# 1. BUILD     : Checkout → Setup Java 21 → Spotless Check → Compile → Test
# 2. DOCKER    : Build Docker Image → Push ke Docker Hub
# 3. DEPLOY    : SSH ke VPS → Pull image terbaru → Restart container
# =============================================================================

name: CI/CD Pipeline

# Trigger: Kapan workflow ini dijalankan
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =========================================================================
  # JOB 1: BUILD & TEST
  # =========================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw
        
    - name: Run Spotless Check
      run: ./mvnw spotless:check
      
    - name: Build with Maven
      run: ./mvnw compile -DskipTests
      
    - name: Run Unit Tests
      run: ./mvnw test

  # =========================================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # Hanya jalan saat push ke main/master (bukan PR)
  # =========================================================================
  docker_build:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/loanova-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/loanova-backend:${{ github.sha }}

  # =========================================================================
  # JOB 3: DEPLOY KE VPS
  # SSH ke VPS, pull image terbaru, restart container
  # =========================================================================
  deploy:
    name: Deploy to VPS
    needs: docker_build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/loanova
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d backend
            docker image prune -f
